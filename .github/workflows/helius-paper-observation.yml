name: Helius 1-hour paper observation

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Observation duration (minutes)"
        required: true
        default: "60"
        type: choice
        options:
          - "60"
          - "30"
  # Deliberately no automatic schedule: start a run manually when you want to observe.

permissions:
  contents: read
  actions: read

concurrency:
  group: helius-paper-observation
  cancel-in-progress: false

jobs:
  paper-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      MODE: paper
      DATA_DIR: ./data
      COIN_OBSERVATION_SECONDS: "600"
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      FEED_WS_URLS: wss://mainnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}
      RPC_HTTP_URL: https://mainnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}
      LANES: K,B
      K_BUY_SELL_RATIO: "1.0"
      K_MIN_TRADES_10: "4"
      K_MIN_BUY_USD_10: "25"
      START_WALLET_USD: "10"
      BASE_STAKE_USD: "1.00"
      MAX_STAKE_USD: "1.00"
      MAX_STAKE_FRAC: "0.10"
      DAILY_LOSS_CAP: "0.10"
      KILL_WALLET_USD: "5"
      MAX_TRADES_PER_DAY: "50"
      PAPER_RESET_AFTER_WIPEOUT: "no"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout observer branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check Helius secret exists
        shell: bash
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "::error::Add HELIUS_API_KEY in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      - name: Find previous wallet intelligence ledger
        id: wallet_history
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "helius-paper-observation.yml", per_page: 50
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id >= Number(context.runId) || run.conclusion !== "success") continue;
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id, per_page: 100
              });
              const found = artifacts.data.artifacts.find(a =>
                a.name === "pumpfun-wallet-intelligence-ledger" && !a.expired
              );
              if (found) {
                core.setOutput("run_id", String(run.id));
                core.info("Found prior wallet ledger in run " + run.id);
                return;
              }
            }
            core.info("No previous wallet ledger found; starting a new history.");

      - name: Download previous wallet ledger
        if: steps.wallet_history.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: pumpfun-wallet-intelligence-ledger
          run-id: ${{ steps.wallet_history.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./wallet-history

      - name: Run paper bot for selected duration
        shell: bash
        run: |
          minutes="${{ inputs.duration_minutes }}"
          seconds=$((minutes * 60))
          total_seconds=$((seconds + 600))
          timeout_seconds=$((total_seconds + 120))
          echo "Discovering coins for ${minutes} minutes. Traded and research-candidate coins receive up to ten minutes of tape. Paper only."
          echo "The bot should stop itself after all observation windows finalize; timeout leaves a 120-second graceful-shutdown buffer."
          set +e
          timeout --signal=INT --kill-after=120s "${timeout_seconds}s" env DISCOVERY_SECONDS="$seconds" COIN_OBSERVATION_SECONDS=600 python -m pumpbot.bot
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "::error::Paper bot exited with status $rc"
            exit "$rc"
          fi
          python scripts/hourly_report.py --data-dir ./data --out ./report
          python scripts/entry_filter_research.py --data-dir ./data --out ./report
          python scripts/wallet_intelligence.py --data-dir ./data --out ./report --history ./wallet-history/wallet_ledger.json

      - name: Upload wallet intelligence ledger for next run
        if: success() && hashFiles('report/wallet_ledger.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pumpfun-wallet-intelligence-ledger
          path: report/wallet_ledger.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload observation data and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpfun-paper-observation-${{ github.run_number }}
          path: |
            data/
            report/
          if-no-files-found: warn
          retention-days: 7
