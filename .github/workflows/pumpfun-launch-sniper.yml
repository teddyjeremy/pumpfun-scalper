name: Pump.fun launch sniper paper observation

on:
  workflow_dispatch:
    inputs:
      discovery_minutes:
        description: "Launch discovery duration"
        required: true
        default: "60"
        type: choice
        options:
          - "60"
          - "30"

permissions:
  contents: read
  actions: read

concurrency:
  group: pumpfun-launch-sniper-paper
  cancel-in-progress: false

jobs:
  sniper-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      MODE: paper
      DATA_DIR: ./data
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
      FEED_WS_URLS: wss://mainnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}
      SNIPER_DISCOVERY_SECONDS: ${{ inputs.discovery_minutes == '30' && '1800' || '3600' }}
      SNIPER_TAIL_SECONDS: "600"
      SNIPER_STAKE_USD: "1.00"
      SNIPER_START_WALLET_USD: "10.00"
      SNIPER_TAKE_PROFIT: "0.20"
      SNIPER_STOP_LOSS: "0.12"
      SNIPER_MAX_HOLD_SECONDS: "30"
      SNIPER_ENTRY_CONFIRM_SECONDS: "3"
      SNIPER_ENTRY_SLIPPAGE: "0.015"
      SNIPER_EXIT_SLIPPAGE: "0.015"
      SNIPER_FEE_RATE: "0.0125"
      SNIPER_GAS_USD: "0.0285"
      SNIPER_V2_CONFIRMATION_MIN_BUYERS: "2"
      SNIPER_V2_CONFIRMATION_MIN_BUY_SOL: "0.50"
      SNIPER_V2_CONFIRMATION_MIN_INTRA_MOVE: "0.05"
      SNIPER_V3_TAKE_PROFIT: "0.25"
      SNIPER_V3_MAX_ENTRY_AGE_SECONDS: "10"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout sniper branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Check Helius secret exists
        shell: bash
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "::error::Add HELIUS_API_KEY in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q
          python -m compileall -q pumpbot scripts

      - name: Run launch sniper paper observation
        shell: bash
        run: |
          duration="$((SNIPER_DISCOVERY_SECONDS + SNIPER_TAIL_SECONDS))"
          timeout_seconds="$((duration + 90))"
          echo "Paper-only launch sniper: discovery=$((SNIPER_DISCOVERY_SECONDS / 60)) minutes, plus ten-minute tape tail."
          timeout --signal=INT --kill-after=30s "${timeout_seconds}s" python -m pumpbot.sniper

      - name: Build sniper report
        if: always()
        run: python scripts/sniper_report.py --data-dir ./data --out ./report

      - name: Replay execution-quality ablations
        if: always()
        run: python -m pumpbot.execution_filter_replay --data-dir ./data --out ./report

      - name: Build latency-aware research report
        if: always()
        run: python scripts/latency_research_report.py --data-dir ./data --out ./report

      - name: Build paired latency and flow replay
        if: always()
        run: python scripts/paired_latency_replay.py --data-dir ./data --out ./report

      - name: Build wallet-loss policy ablation
        if: always()
        run: python scripts/wallet_policy_replay.py --data-dir ./data --out ./report

      - name: Build market microstructure and execution-integrity report
        if: always()
        run: python scripts/market_microstructure_research.py --data-dir ./data --out ./report

      - name: Upload sniper observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pumpfun-launch-sniper-${{ github.run_number }}
          path: |
            data/
            report/
          if-no-files-found: warn
          retention-days: 14
